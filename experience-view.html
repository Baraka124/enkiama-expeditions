<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enkiama View — Tanzania, in motion</title>
<meta name="description" content="A cinematic Enkiama view of Tanzania through landscapes, operated journeys and the route logic that connects them.">
<meta name="theme-color" content="#08100B">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08100B;
  --ink2:#0D1510;
  --bone:#EDE6D6;
  --earth:#BE9E68;
  --sage:#7A9470;
  --muted:rgba(237,230,214,.64);
  --hair:rgba(237,230,214,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Instrument Sans',sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.ev{position:relative;width:100vw;height:100dvh;background:var(--ink);overflow:hidden;isolation:isolate}
.ev-scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease;overflow:hidden;background:var(--ink)}
.ev-scene.active{opacity:1;pointer-events:auto}
.ev-media,.ev-media::after{position:absolute;inset:0}
.ev-media{background-size:cover;background-position:center;transform:scale(1.045);transition:transform 11s cubic-bezier(.16,1,.3,1)}
.ev-scene.active .ev-media{transform:scale(1)}
.ev-media::after{content:'';background:
linear-gradient(180deg,rgba(6,11,8,.16),rgba(6,11,8,.02) 34%,rgba(6,11,8,.76) 100%),
linear-gradient(90deg,rgba(6,11,8,.58),rgba(6,11,8,.12) 48%,transparent 74%)}

.ev-top{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(1.25rem,3vw,2.2rem) clamp(1.3rem,4vw,3.5rem)}
.ev-logo img{height:clamp(34px,4vw,48px);display:block;width:auto}
.ev-top-right{display:flex;align-items:center;gap:1rem}
.ev-mode{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,230,214,.42)}
.ev-exit{font-size:10px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:rgba(237,230,214,.7)}
.ev-exit::after{content:' ×';color:var(--earth);font-size:17px}

.ev-copy{position:absolute;z-index:8;left:clamp(1.4rem,7vw,7rem);bottom:clamp(7.2rem,14vh,10.5rem);max-width:min(860px,78vw)}
.ev-kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--earth);margin:0 0 1rem}
.ev-title{font-family:'Fraunces',serif;font-size:clamp(44px,7.2vw,104px);font-weight:300;line-height:.92;letter-spacing:-.04em;max-width:10.5ch;margin:0;text-wrap:balance}
.ev-title em{font-style:italic;color:var(--earth)}
.ev-note{max-width:52ch;margin:1.4rem 0 0;font-size:clamp(13px,1.12vw,16px);line-height:1.74;color:var(--muted)}
.ev-route{display:none;margin:1.35rem 0 0;padding-top:1rem;border-top:1px solid var(--hair);max-width:70ch;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,230,214,.72)}
.ev-route.visible{display:block}
.ev-evidence{display:none;gap:.7rem 1.2rem;flex-wrap:wrap;margin-top:1rem}
.ev-evidence.visible{display:flex}
.ev-chip{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(237,230,214,.5)}
.ev-chip b{font-family:'Fraunces',serif;font-size:18px;font-weight:300;letter-spacing:0;text-transform:none;color:var(--bone);margin-right:.3rem}
.ev-link{display:none;width:max-content;margin-top:1.45rem;text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid rgba(190,158,104,.52);padding-bottom:.35rem}
.ev-link.visible{display:inline-block}

/* Quiet opening / closing */
.ev-scene.quiet{background:#070d09}
.ev-scene.quiet .ev-copy{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:min(900px,84vw)}
.ev-scene.quiet .ev-title{margin-inline:auto;max-width:12ch}
.ev-scene.quiet .ev-note{margin-inline:auto;max-width:44ch}
.ev-scene.quiet .ev-kicker{opacity:.72}
.ev-scene.quiet::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(45,64,48,.16),transparent 44%)}

/* Full bleed A-grade landscape */
.ev-scene.full .ev-copy{max-width:min(760px,70vw)}
.ev-scene.full .ev-title{max-width:9ch}

/* Editorial framed image for B-grade / documentary */
.ev-scene.frame{background:linear-gradient(155deg,#111913,#070c09)}
.ev-scene.frame .ev-media{inset:9% 9% 10%;transform:scale(1.015);box-shadow:0 0 0 1px rgba(237,230,214,.12),0 30px 100px rgba(0,0,0,.38)}
.ev-scene.frame.active .ev-media{transform:scale(1)}
.ev-scene.frame .ev-media::after{background:linear-gradient(180deg,rgba(6,11,8,.08),rgba(6,11,8,.15) 60%,rgba(6,11,8,.6))}
.ev-scene.frame .ev-copy{left:clamp(1.4rem,6vw,6rem);bottom:clamp(6.8rem,12vh,9rem);max-width:min(620px,54vw)}
.ev-frame-label{position:absolute;z-index:6;right:9%;bottom:5.5%;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,230,214,.48)}

/* Route atlas */
.ev-scene.route{background:#0B120D}
.ev-scene.route .ev-media::after{background:linear-gradient(90deg,rgba(7,12,9,.82),rgba(7,12,9,.2) 50%,rgba(7,12,9,.44))}
.ev-atlas{position:absolute;z-index:5;left:8%;right:8%;bottom:11%;height:23%}
.ev-atlas svg{width:100%;height:100%;overflow:visible}
.ev-atlas path{fill:none;stroke:rgba(190,158,104,.7);stroke-width:1.25;stroke-dasharray:7 8;vector-effect:non-scaling-stroke}
.ev-atlas circle{fill:#BE9E68}
.ev-atlas text{fill:rgba(237,230,214,.62);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-family:'Instrument Sans',sans-serif}
.ev-scene.route .ev-copy{bottom:clamp(10.5rem,20vh,14rem);max-width:min(700px,68vw)}

/* Documentary contact sheet */
.ev-scene.sheet{background:#0a110c}
.ev-contact{position:absolute;z-index:2;inset:9% 8% 13%;display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:1fr 1fr;gap:10px}
.ev-contact figure{margin:0;position:relative;overflow:hidden;background:#111913}
.ev-contact figure:first-child{grid-row:1 / span 2}
.ev-contact img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.02)}
.ev-contact figure::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,8,.03),rgba(6,11,8,.36))}
.ev-contact figcaption{position:absolute;z-index:2;left:.8rem;bottom:.7rem;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:rgba(237,230,214,.72)}
.ev-scene.sheet .ev-copy{left:auto;right:8%;bottom:5.3%;max-width:44vw;text-align:right}
.ev-scene.sheet .ev-title{max-width:11ch;margin-left:auto}
.ev-scene.sheet .ev-note{margin-left:auto}

/* Split transition */
.ev-scene.split .ev-media{clip-path:polygon(0 0,61% 0,52% 100%,0 100%)}
.ev-scene.split::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 52%,rgba(7,12,9,.86) 66% 100%)}
.ev-scene.split .ev-copy{left:auto;right:clamp(2rem,7vw,7rem);max-width:min(530px,38vw);bottom:clamp(7rem,14vh,10rem)}

/* Navigation / progress */
.ev-chapter{position:absolute;z-index:10;left:clamp(1.2rem,3vw,2.5rem);top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,230,214,.32);white-space:nowrap}
.ev-number{position:absolute;z-index:4;right:clamp(1rem,3vw,2.4rem);bottom:clamp(7rem,14vh,10rem);font-family:'Fraunces',serif;font-size:clamp(68px,11vw,160px);font-style:italic;line-height:.8;color:rgba(237,230,214,.045);user-select:none}
.ev-rail{position:absolute;z-index:20;left:clamp(1.4rem,7vw,7rem);right:clamp(1.4rem,7vw,7rem);bottom:clamp(1.4rem,3vw,2.4rem);display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end}
.ev-progress{height:1px;background:rgba(237,230,214,.16);overflow:hidden;position:relative}
.ev-progress span{position:absolute;inset:0 auto 0 0;width:0;background:var(--earth)}
.ev-progress span.run{animation:evProgress 10s linear forwards}
@keyframes evProgress{from{width:0}to{width:100%}}
.ev-meta{display:flex;gap:1rem;align-items:center;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(237,230,214,.46)}
.ev-index{color:var(--earth)}
.ev-controls{position:absolute;z-index:21;right:clamp(1.4rem,4vw,3.5rem);bottom:clamp(4.5rem,8vh,6.2rem);display:flex;gap:.45rem;opacity:.5;transition:opacity .25s}
.ev:hover .ev-controls,.ev:focus-within .ev-controls{opacity:1}
.ev-btn{width:38px;height:38px;border:1px solid rgba(237,230,214,.18);border-radius:50%;background:rgba(7,12,9,.22);color:var(--bone);display:grid;place-items:center;cursor:pointer;font-size:14px;backdrop-filter:blur(5px)}
.ev-btn:hover{border-color:rgba(190,158,104,.7);color:var(--earth)}

/* scene-specific media */
.s2 .ev-media{background-image:url('assets/images/kilimanjaro.jpg');background-position:center 47%}
.s3 .ev-media{background-image:url('assets/serengeti.jpg');background-position:center 52%}
.s4 .ev-media{background-image:url('assets/images/ngorongoro.webp');background-position:center 55%}
.s5 .ev-media{background-image:url('assets/zanzibar.jpg');background-position:center 58%}

@media(max-width:760px){
  .ev-mode{display:none}
  .ev-copy,.ev-scene.full .ev-copy,.ev-scene.frame .ev-copy,.ev-scene.route .ev-copy,.ev-scene.split .ev-copy,.ev-scene.sheet .ev-copy{left:1.3rem;right:1.3rem;bottom:7rem;max-width:none;text-align:left;transform:none}
  .ev-scene.quiet .ev-copy{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(100% - 2.6rem)}
  .ev-title{font-size:clamp(40px,12vw,66px);max-width:10ch}
  .ev-note{max-width:34ch;line-height:1.62}
  .ev-contact{inset:10% 1rem 30%;grid-template-columns:1fr 1fr;grid-template-rows:1.2fr .8fr}
  .ev-contact figure:first-child{grid-column:1 / span 2;grid-row:auto}
  .ev-scene.sheet .ev-copy{bottom:6.8rem}
  .ev-scene.frame .ev-media{inset:9% 1rem 27%}
  .ev-frame-label{right:1rem;bottom:25%}
  .ev-scene.split .ev-media{clip-path:none}
  .ev-scene.split::after{background:linear-gradient(180deg,rgba(6,11,8,.06),rgba(6,11,8,.75))}
  .ev-atlas{left:1.5rem;right:1.5rem;bottom:20%;height:16%}
  .ev-chapter{display:none}
  .ev-number{right:.6rem;bottom:7.8rem;font-size:26vw}
  .ev-controls{right:1rem;bottom:4.5rem;opacity:.9}
  .ev-rail{left:1.3rem;right:1.3rem;grid-template-columns:1fr}
  .ev-meta{display:none}
}
@media(max-height:700px) and (min-width:761px){
  .ev-copy{bottom:5.8rem}
  .ev-title{font-size:clamp(42px,6.7vw,82px)}
}
@media(prefers-reduced-motion:reduce){
  .ev-scene{transition:opacity .3s}
  .ev-media{transform:none!important;transition:none!important}
  .ev-progress span.run{animation:none;width:100%}
}
</style>
</head>
<body>
<main class="ev" aria-label="Enkiama View">

  <section class="ev-scene quiet active"
    data-chapter="Act I · Tanzania"
    data-kicker="Enkiama · Tanzania"
    data-title="You are not choosing <em>a safari.</em>"
    data-note="You are deciding how to cross Tanzania."
    data-meta="Opening"></section>

  <section class="ev-scene full s2"
    data-chapter="Act II · We are here"
    data-kicker="Based in Tanzania · journeys shaped here"
    data-title="Start with the country, not the <em>checklist.</em>"
    data-note="Mountain, wildlife, people, Rift landscapes and coast behave differently through the year. The route only works when those worlds are sequenced around the people travelling."
    data-meta="Local operation"
    data-link="tanzania.html"
    data-link-label="Explore Tanzania">
    <div class="ev-media" aria-hidden="true"></div>
  </section>

  <section class="ev-scene sheet"
    data-chapter="Act III · Human scale"
    data-kicker="People · place · ordinary moments"
    data-title="The landscape is only part of the <em>journey.</em>"
    data-note="Family hospitality, a guide who knows the road, a camp arrival, a conversation over coffee — these are not extras around the safari. They are part of how the trip is actually experienced."
    data-meta="Documentary moments">
    <div class="ev-contact" aria-hidden="true">
      <figure><img src="assets/images/kibosho-family.jpg" alt=""><figcaption>Kibosho · Kilimanjaro highlands</figcaption></figure>
      <figure><img src="assets/images/camp-arrival.jpg" alt=""><figcaption>Arrival · on the road</figcaption></figure>
      <figure><img src="assets/images/guide-daniel.jpg" alt=""><figcaption>Guide-led · locally operated</figcaption></figure>
    </div>
  </section>

  <section class="ev-scene route s3"
    data-chapter="Act IV · Operated"
    data-kicker="Operated · July 2026 · 5 travellers"
    data-title="One journey. Four different <em>rhythms.</em>"
    data-note="Mountain culture, safari, Rift landscape and coast were composed as one route rather than four separate products."
    data-route="Kilimanjaro → Tarangire → Ngorongoro → Serengeti → Zanzibar"
    data-evidence="13|nights;5|travellers;4|journey worlds"
    data-link="journeys.html"
    data-link-label="See operated journeys"
    data-meta="Operated evidence">
    <div class="ev-media" aria-hidden="true"></div>
    <div class="ev-atlas" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path d="M30,83 C170,24 270,28 365,60 S565,100 690,69 S835,40 968,27"></path>
        <circle cx="30" cy="83" r="4"></circle>
        <circle cx="255" cy="38" r="4"></circle>
        <circle cx="445" cy="82" r="4"></circle>
        <circle cx="690" cy="69" r="4"></circle>
        <circle cx="968" cy="27" r="4"></circle>
        <text x="28" y="108">Kilimanjaro</text>
        <text x="218" y="20">Tarangire</text>
        <text x="405" y="108">Ngorongoro</text>
        <text x="660" y="48">Serengeti</text>
        <text x="918" y="16">Zanzibar</text>
      </svg>
    </div>
  </section>

  <section class="ev-scene split s4"
    data-chapter="Act V · The country changes"
    data-kicker="Season · distance · pace"
    data-title="The same Tanzania does not exist <em>every month.</em>"
    data-note="Rain, wildlife movement, altitude, road time and ocean conditions change what belongs together. Good planning is often deciding what not to force into the route."
    data-link="parks.html"
    data-link-label="Compare landscapes"
    data-meta="Route intelligence">
    <div class="ev-media" aria-hidden="true"></div>
  </section>

  <section class="ev-scene frame"
    data-chapter="Act VI · Coast"
    data-kicker="Stone Town · then the Indian Ocean"
    data-title="The journey can change <em>tempo.</em>"
    data-note="City, history and coast should feel like a new chapter, not an automatic beach extension after safari."
    data-route="Stone Town → coast"
    data-link="zanzibar.html"
    data-link-label="Explore Zanzibar"
    data-meta="Coast transition">
    <div class="ev-media" style="background-image:url('assets/images/stonetown.jpg');background-position:center 50%" aria-hidden="true"></div>
    <div class="ev-frame-label">Documentary frame · lower-resolution source used intentionally</div>
  </section>

  <section class="ev-scene full s5"
    data-chapter="Act VII · Exhale"
    data-kicker="Indian Ocean · final rhythm"
    data-title="Then the journey <em>exhales.</em>"
    data-note="The coast earns its place when it changes the ending of the trip."
    data-meta="Zanzibar">
    <div class="ev-media" aria-hidden="true"></div>
  </section>

  <section class="ev-scene quiet"
    data-chapter="Close · Begin"
    data-kicker="Enkiama · one group at a time"
    data-title="Tell us when you are <em>coming.</em>"
    data-note="Dates, people and what is drawing you to Tanzania are enough to begin. The route comes after."
    data-link="begin.html"
    data-link-label="Begin a conversation"
    data-meta="Enkiama"></section>

  <header class="ev-top">
    <a class="ev-logo" href="index.html" aria-label="Back to Enkiama"><img src="assets/logo-header.png" alt="Enkiama Tanzania"></a>
    <div class="ev-top-right">
      <span class="ev-mode">View · cinematic edition</span>
      <a class="ev-exit" href="index.html">Exit</a>
    </div>
  </header>

  <div class="ev-chapter" id="evChapter">Act I · Tanzania</div>
  <div class="ev-number" id="evNumber" aria-hidden="true">01</div>

  <section class="ev-copy" aria-live="polite">
    <p class="ev-kicker" id="evKicker">Enkiama · Tanzania</p>
    <h1 class="ev-title" id="evTitle">You are not choosing <em>a safari.</em></h1>
    <p class="ev-note" id="evNote">You are deciding how to cross Tanzania.</p>
    <p class="ev-route" id="evRoute"></p>
    <div class="ev-evidence" id="evEvidence"></div>
    <a class="ev-link" id="evLink"></a>
  </section>

  <div class="ev-controls" aria-label="View controls">
    <button class="ev-btn" id="evPrev" aria-label="Previous scene">←</button>
    <button class="ev-btn" id="evPause" aria-label="Pause view">Ⅱ</button>
    <button class="ev-btn" id="evNext" aria-label="Next scene">→</button>
  </div>

  <div class="ev-rail">
    <div class="ev-progress"><span id="evProgress" class="run"></span></div>
    <div class="ev-meta"><span class="ev-index" id="evIndex">01 / 08</span><span id="evMeta">Opening</span></div>
  </div>
</main>

<script>
(function(){
  var scenes=[].slice.call(document.querySelectorAll('.ev-scene'));
  var kicker=document.getElementById('evKicker');
  var title=document.getElementById('evTitle');
  var note=document.getElementById('evNote');
  var route=document.getElementById('evRoute');
  var evidence=document.getElementById('evEvidence');
  var chapter=document.getElementById('evChapter');
  var number=document.getElementById('evNumber');
  var link=document.getElementById('evLink');
  var index=document.getElementById('evIndex');
  var meta=document.getElementById('evMeta');
  var progress=document.getElementById('evProgress');
  var pause=document.getElementById('evPause');
  var current=0,timer=null,paused=false,interval=10000;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function restartProgress(){
    progress.classList.remove('run');
    void progress.offsetWidth;
    if(!paused&&!reduce) progress.classList.add('run');
  }

  function setEvidence(raw){
    evidence.innerHTML='';
    evidence.classList.remove('visible');
    if(!raw) return;
    raw.split(';').forEach(function(item){
      var p=item.split('|');
      if(p.length<2) return;
      var el=document.createElement('span');
      el.className='ev-chip';
      el.innerHTML='<b>'+p[0]+'</b>'+p[1];
      evidence.appendChild(el);
    });
    if(evidence.children.length) evidence.classList.add('visible');
  }

  function show(i){
    current=(i+scenes.length)%scenes.length;
    scenes.forEach(function(scene,n){scene.classList.toggle('active',n===current);});
    var s=scenes[current];
    kicker.textContent=s.dataset.kicker||'';
    title.innerHTML=s.dataset.title||'';
    note.textContent=s.dataset.note||'';
    chapter.textContent=s.dataset.chapter||'';
    number.textContent=String(current+1).padStart(2,'0');
    index.textContent=String(current+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
    meta.textContent=s.dataset.meta||'Enkiama';

    if(s.dataset.route){
      route.textContent=s.dataset.route;
      route.classList.add('visible');
    }else{
      route.textContent='';
      route.classList.remove('visible');
    }

    setEvidence(s.dataset.evidence||'');

    if(s.dataset.link){
      link.href=s.dataset.link;
      link.textContent=(s.dataset.linkLabel||'Open')+' →';
      link.classList.add('visible');
    }else{
      link.removeAttribute('href');
      link.textContent='';
      link.classList.remove('visible');
    }
    restartProgress();
  }

  function schedule(){
    clearInterval(timer);
    if(!paused&&!reduce) timer=setInterval(function(){show(current+1);},interval);
  }

  document.getElementById('evPrev').addEventListener('click',function(){show(current-1);schedule();});
  document.getElementById('evNext').addEventListener('click',function(){show(current+1);schedule();});
  pause.addEventListener('click',function(){
    paused=!paused;
    pause.textContent=paused?'▶':'Ⅱ';
    pause.setAttribute('aria-label',paused?'Play view':'Pause view');
    if(paused){clearInterval(timer);progress.classList.remove('run');}
    else{restartProgress();schedule();}
  });

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){show(current+1);schedule();}
    if(e.key==='ArrowLeft'){show(current-1);schedule();}
    if(e.key===' '){e.preventDefault();pause.click();}
    if(e.key==='Escape') location.href='index.html';
  });

  show(0);
  schedule();
})();
</script>
</body>
</html>
