<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enkiama View — Tanzania, in motion</title>
<meta name="description" content="A cinematic Enkiama view of Tanzania through landscapes, operated journeys and the route logic that connects them.">
<link rel="canonical" href="https://enkiama.com/experience-view.html">
<meta name="theme-color" content="#08100B">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#08100B;
  --ink2:#0D1510;
  --bone:#EDE6D6;
  --earth:#BE9E68;
  --sage:#7A9470;
  --muted:rgba(237,230,214,.64);
  --hair:rgba(237,230,214,.16);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Instrument Sans',sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.ev{position:relative;width:100vw;height:100dvh;background:var(--ink);overflow:hidden;isolation:isolate}
.ev-scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease;overflow:hidden;background:var(--ink)}
.ev-scene.active{opacity:1;pointer-events:auto}
.ev-media,.ev-media::after{position:absolute;inset:0}
.ev-media{background-size:cover;background-position:center;transform:scale(1.045);transition:transform 11s cubic-bezier(.16,1,.3,1)}
.ev-scene.active .ev-media{transform:scale(1)}
.ev-media::after{content:'';background:
linear-gradient(180deg,rgba(6,11,8,.16),rgba(6,11,8,.02) 34%,rgba(6,11,8,.76) 100%),
linear-gradient(90deg,rgba(6,11,8,.58),rgba(6,11,8,.12) 48%,transparent 74%)}

.ev-top{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(1.25rem,3vw,2.2rem) clamp(1.3rem,4vw,3.5rem)}
.ev-logo img{height:clamp(34px,4vw,48px);display:block;width:auto}
.ev-top-right{display:flex;align-items:center;gap:1rem}
.ev-mode{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,230,214,.42)}
.ev-exit{font-size:10px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:rgba(237,230,214,.7)}
.ev-exit::after{content:' ×';color:var(--earth);font-size:17px}

.ev-copy{position:absolute;z-index:8;left:clamp(1.4rem,7vw,7rem);bottom:clamp(7.2rem,14vh,10.5rem);max-width:min(860px,78vw)}
.ev-kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--earth);margin:0 0 1rem}
.ev-title{font-family:'Fraunces',serif;font-size:clamp(44px,7.2vw,104px);font-weight:300;line-height:.92;letter-spacing:-.04em;max-width:10.5ch;margin:0;text-wrap:balance}
.ev-title em{font-style:italic;color:var(--earth)}
.ev-note{max-width:52ch;margin:1.4rem 0 0;font-size:clamp(13px,1.12vw,16px);line-height:1.74;color:var(--muted)}
.ev-route{display:none;margin:1.35rem 0 0;padding-top:1rem;border-top:1px solid var(--hair);max-width:70ch;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,230,214,.72)}
.ev-route.visible{display:block}
.ev-evidence{display:none;gap:.7rem 1.2rem;flex-wrap:wrap;margin-top:1rem}
.ev-evidence.visible{display:flex}
.ev-chip{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(237,230,214,.5)}
.ev-chip b{font-family:'Fraunces',serif;font-size:18px;font-weight:300;letter-spacing:0;text-transform:none;color:var(--bone);margin-right:.3rem}
.ev-link{display:none;width:max-content;margin-top:1.45rem;text-decoration:none;font-size:10px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid rgba(190,158,104,.52);padding-bottom:.35rem}
.ev-link.visible{display:inline-block}

/* Quiet opening / closing */
.ev-scene.quiet{background:#070d09}
.ev-scene.quiet .ev-copy{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:min(900px,84vw)}
.ev-scene.quiet .ev-title{margin-inline:auto;max-width:12ch}
.ev-scene.quiet .ev-note{margin-inline:auto;max-width:44ch}
.ev-scene.quiet .ev-kicker{opacity:.72}
.ev-scene.quiet::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(45,64,48,.16),transparent 44%)}

/* Full bleed A-grade landscape */
.ev-scene.full .ev-copy{max-width:min(760px,70vw)}
.ev-scene.full .ev-title{max-width:9ch}

/* Editorial framed image for B-grade / documentary */
.ev-scene.frame{background:linear-gradient(155deg,#111913,#070c09)}
.ev-scene.frame .ev-media{inset:9% 9% 10%;transform:scale(1.015);box-shadow:0 0 0 1px rgba(237,230,214,.12),0 30px 100px rgba(0,0,0,.38)}
.ev-scene.frame.active .ev-media{transform:scale(1)}
.ev-scene.frame .ev-media::after{background:linear-gradient(180deg,rgba(6,11,8,.08),rgba(6,11,8,.15) 60%,rgba(6,11,8,.6))}
.ev-scene.frame .ev-copy{left:clamp(1.4rem,6vw,6rem);bottom:clamp(6.8rem,12vh,9rem);max-width:min(620px,54vw)}
.ev-frame-label{position:absolute;z-index:6;right:9%;bottom:5.5%;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,230,214,.48)}

/* Route atlas */
.ev-scene.route{background:#0B120D}
.ev-scene.route .ev-media::after{background:linear-gradient(90deg,rgba(7,12,9,.82),rgba(7,12,9,.2) 50%,rgba(7,12,9,.44))}
.ev-atlas{position:absolute;z-index:5;left:8%;right:8%;bottom:11%;height:23%}
.ev-atlas svg{width:100%;height:100%;overflow:visible}
.ev-atlas path{fill:none;stroke:rgba(190,158,104,.7);stroke-width:1.25;stroke-dasharray:7 8;vector-effect:non-scaling-stroke}
.ev-atlas circle{fill:#BE9E68}
.ev-atlas text{fill:rgba(237,230,214,.62);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-family:'Instrument Sans',sans-serif}
.ev-scene.route .ev-copy{bottom:clamp(10.5rem,20vh,14rem);max-width:min(700px,68vw)}

/* Documentary contact sheet */
.ev-scene.sheet{background:#0a110c}
.ev-contact{position:absolute;z-index:2;inset:9% 8% 13%;display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:1fr 1fr;gap:10px}
.ev-contact figure{margin:0;position:relative;overflow:hidden;background:#111913}
.ev-contact figure:first-child{grid-row:1 / span 2}
.ev-contact img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.92) contrast(1.02)}
.ev-contact figure::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,8,.03),rgba(6,11,8,.36))}
.ev-contact figcaption{position:absolute;z-index:2;left:.8rem;bottom:.7rem;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:rgba(237,230,214,.72)}
.ev-scene.sheet .ev-copy{left:auto;right:8%;bottom:5.3%;max-width:44vw;text-align:right}
.ev-scene.sheet .ev-title{max-width:11ch;margin-left:auto}
.ev-scene.sheet .ev-note{margin-left:auto}

/* Split transition */
.ev-scene.split .ev-media{clip-path:polygon(0 0,61% 0,52% 100%,0 100%)}
.ev-scene.split::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 52%,rgba(7,12,9,.86) 66% 100%)}
.ev-scene.split .ev-copy{left:auto;right:clamp(2rem,7vw,7rem);max-width:min(530px,38vw);bottom:clamp(7rem,14vh,10rem)}

/* Navigation / progress */
.ev-chapter{position:absolute;z-index:10;left:clamp(1.2rem,3vw,2.5rem);top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center;font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(237,230,214,.32);white-space:nowrap}
.ev-number{position:absolute;z-index:4;right:clamp(1rem,3vw,2.4rem);bottom:clamp(7rem,14vh,10rem);font-family:'Fraunces',serif;font-size:clamp(68px,11vw,160px);font-style:italic;line-height:.8;color:rgba(237,230,214,.045);user-select:none}
.ev-rail{position:absolute;z-index:20;left:clamp(1.4rem,7vw,7rem);right:clamp(1.4rem,7vw,7rem);bottom:clamp(1.4rem,3vw,2.4rem);display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end}
.ev-progress{height:1px;background:rgba(237,230,214,.16);overflow:hidden;position:relative}
.ev-progress span{position:absolute;inset:0 auto 0 0;width:0;background:var(--earth)}
.ev-progress span.run{animation:evProgress var(--ev-scene-duration,10s) linear forwards}
@keyframes evProgress{from{width:0}to{width:100%}}
.ev-meta{display:flex;gap:1rem;align-items:center;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:rgba(237,230,214,.46)}
.ev-index{color:var(--earth)}
.ev-controls{position:absolute;z-index:21;right:clamp(1.4rem,4vw,3.5rem);bottom:clamp(4.5rem,8vh,6.2rem);display:flex;gap:.45rem;opacity:.5;transition:opacity .25s}
.ev:hover .ev-controls,.ev:focus-within .ev-controls{opacity:1}
.ev-btn{width:38px;height:38px;border:1px solid rgba(237,230,214,.18);border-radius:50%;background:rgba(7,12,9,.22);color:var(--bone);display:grid;place-items:center;cursor:pointer;font-size:14px;backdrop-filter:blur(5px)}
.ev-btn:hover{border-color:rgba(190,158,104,.7);color:var(--earth)}

/* scene-specific media */
.s2 .ev-media{background-image:url('assets/images/kilimanjaro.jpg');background-position:center 47%}
.s3 .ev-media{background-image:url('assets/serengeti.jpg');background-position:center 52%}
.s4 .ev-media{background-image:url('assets/images/ngorongoro.webp');background-position:center 55%}
.s5 .ev-media{background-image:url('assets/zanzibar.jpg');background-position:center 58%}



/* Phase 4 · layout hardening */
.ev{
  --safe-top:clamp(5.8rem,11vh,8.2rem);
  --safe-bottom:clamp(6.4rem,12vh,8.6rem);
  --safe-x:clamp(1.4rem,7vw,7rem);
}
.ev-copy{top:auto;max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom));overflow:visible}
.ev-title{font-size:clamp(42px,6.6vw,94px)}
.ev-note{max-width:48ch}
.ev-number{pointer-events:none}
.ev-controls{bottom:calc(var(--safe-bottom) - 1.2rem)}
.ev-rail{bottom:clamp(1rem,2.4vw,2rem)}
.ev-progress{min-width:0}
.ev.drawer-open .ev-controls,.ev.drawer-open .ev-rail{opacity:.14;pointer-events:none}
.ev.drawer-open .ev-scene.active{filter:saturate(.82) brightness(.72)}
.ev-scene.active{transition:opacity .9s ease,filter .35s ease}

/* contact sheet owns upper field; copy owns lower field */
.ev-scene.sheet .ev-contact{inset:var(--safe-top) 8% 36%}
.ev-scene.sheet .ev-copy{
  left:8%;right:8%;bottom:var(--safe-bottom);max-width:none;text-align:left;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.68fr);column-gap:clamp(2rem,5vw,5rem);align-items:end
}
.ev-scene.sheet .ev-kicker,.ev-scene.sheet .ev-title{grid-column:1}
.ev-scene.sheet .ev-note,.ev-scene.sheet .ev-route,.ev-scene.sheet .ev-evidence,.ev-scene.sheet .ev-link,.ev-scene.sheet .ev-field-open{grid-column:2;margin-left:0}
.ev-scene.sheet .ev-title{margin-left:0;max-width:10ch}
.ev-scene.sheet .ev-note{margin-top:0;max-width:42ch}

/* route composition reserves a clean lower intelligence band */
.ev-scene.route .ev-copy{bottom:clamp(13.5rem,24vh,17rem);max-width:min(690px,62vw)}
.ev-scene.route .ev-atlas{left:var(--safe-x);right:var(--safe-x);bottom:var(--safe-bottom);height:clamp(70px,11vh,110px)}
.ev-scene.route .ev-number{display:none}

/* framed media never collides with copy */
.ev-scene.frame .ev-media{inset:var(--safe-top) 8% 30%}
.ev-scene.frame .ev-copy{bottom:var(--safe-bottom);max-width:min(660px,64vw)}
.ev-frame-label{right:8%;bottom:calc(var(--safe-bottom) + .3rem)}

/* split copy gets a real text column */
.ev-scene.split .ev-media{clip-path:polygon(0 0,57% 0,49% 100%,0 100%)}
.ev-scene.split::after{background:linear-gradient(90deg,transparent 0 48%,rgba(7,12,9,.6) 55%,rgba(7,12,9,.94) 68% 100%)}
.ev-scene.split .ev-copy{right:var(--safe-x);bottom:var(--safe-bottom);max-width:min(500px,36vw)}

/* header collision prevention */
.ev-top{gap:1.5rem}
.ev-top-right{min-width:0;flex-wrap:wrap;justify-content:flex-end}
.ev-live-open,.ev-exit{white-space:nowrap}

/* drawers behave like modal editorial surfaces */
.ev-live-panel,.ev-field{overscroll-behavior:contain;box-shadow:-30px 0 90px rgba(0,0,0,.34)}
.ev-live-panel[aria-hidden="true"],.ev-field[aria-hidden="true"]{visibility:hidden}
.ev-live-panel.open,.ev-field.open{visibility:visible}
.ev-panel-scrim{position:absolute;z-index:35;inset:0;background:rgba(4,8,6,.44);opacity:0;pointer-events:none;transition:opacity .35s ease}
.ev.drawer-open .ev-panel-scrim{opacity:1;pointer-events:auto}

@media(max-width:900px){
  .ev{--safe-top:5.8rem;--safe-bottom:6.2rem}
  .ev-title{font-size:clamp(40px,8.6vw,72px)}
  .ev-scene.sheet .ev-contact{inset:5.8rem 1.4rem 44%}
  .ev-scene.sheet .ev-copy{left:1.4rem;right:1.4rem;bottom:6.4rem;display:block;max-width:620px}
  .ev-scene.sheet .ev-note{margin-top:1rem}
  .ev-scene.route .ev-copy{bottom:12.5rem;max-width:76vw}
  .ev-scene.route .ev-atlas{bottom:6.8rem;height:80px}
  .ev-scene.split .ev-copy{max-width:44vw}
}
@media(max-width:760px){
  .ev{--safe-top:5.1rem;--safe-bottom:5.6rem}
  .ev-top{padding:1rem 1.15rem}
  .ev-logo img{height:34px}
  .ev-top-right{gap:.65rem}
  .ev-live-open{order:1}
  .ev-exit{order:2}
  .ev-copy,.ev-scene.full .ev-copy,.ev-scene.frame .ev-copy,.ev-scene.route .ev-copy,.ev-scene.split .ev-copy,.ev-scene.sheet .ev-copy{
    left:1.2rem;right:1.2rem;bottom:6.15rem;max-height:calc(100dvh - 12rem);overflow:hidden
  }
  .ev-title{font-size:clamp(36px,11.2vw,58px);line-height:.94;max-width:10ch}
  .ev-note{font-size:12.5px;line-height:1.56;max-width:33ch;margin-top:.9rem}
  .ev-kicker{font-size:8px;margin-bottom:.65rem}
  .ev-route{font-size:8.5px;margin-top:.8rem;padding-top:.65rem}
  .ev-evidence{margin-top:.65rem;gap:.4rem .7rem}
  .ev-chip{font-size:8px}.ev-chip b{font-size:15px}
  .ev-link{margin-top:.8rem;font-size:8.5px}
  .ev-field-open{margin-top:.7rem;font-size:8.5px}
  .ev-scene.sheet .ev-contact{inset:5.2rem 1rem 47%;gap:6px}
  .ev-contact figcaption{font-size:7px;left:.5rem;bottom:.45rem}
  .ev-scene.sheet .ev-copy{bottom:6.1rem}
  .ev-scene.frame .ev-media{inset:5.3rem 1rem 43%}
  .ev-frame-label{display:none}
  .ev-scene.route .ev-copy{bottom:10.4rem;max-height:calc(100dvh - 15.7rem)}
  .ev-scene.route .ev-atlas{left:1.2rem;right:1.2rem;bottom:6.25rem;height:54px}
  .ev-scene.split .ev-media{clip-path:none;inset:0 0 42%}
  .ev-scene.split::after{background:linear-gradient(180deg,rgba(6,11,8,.04) 0 42%,rgba(6,11,8,.9) 62% 100%)}
  .ev-scene.split .ev-copy{max-width:none}
  .ev-number{display:none}
  .ev-controls{bottom:3.9rem;right:1rem}
  .ev-btn{width:34px;height:34px}
  .ev-rail{left:1.2rem;right:1.2rem;bottom:1rem}
}
@media(max-height:650px) and (min-width:761px){
  .ev{--safe-top:5.2rem;--safe-bottom:5.3rem}
  .ev-title{font-size:clamp(38px,5.5vw,68px)}
  .ev-note{font-size:12px;line-height:1.55;margin-top:.8rem}
  .ev-scene.route .ev-copy{bottom:10.5rem}
  .ev-scene.route .ev-atlas{height:58px}
}


.ev-live-intro{padding:1.5rem;border-bottom:1px solid rgba(237,230,214,.08)}
.ev-live-intro strong{display:block;font-family:'Fraunces',serif;font-size:28px;font-weight:300;line-height:1.1;max-width:12ch}
.ev-live-intro p{margin:.7rem 0 0;font-size:11px;line-height:1.65;color:rgba(237,230,214,.56);max-width:38ch}
.ev-live-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.85rem 1.5rem;border-bottom:1px solid rgba(237,230,214,.08);scrollbar-width:none}
.ev-live-tabs::-webkit-scrollbar{display:none}
.ev-live-tabs button{flex:0 0 auto;border:1px solid rgba(237,230,214,.12);background:transparent;color:rgba(237,230,214,.58);padding:.55rem .7rem;font-size:8px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.ev-live-tabs button.active{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.ev-live-panel__channels{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0}
.ev-live-channel{padding:1rem 1.2rem;border-right:1px solid rgba(237,230,214,.08);border-bottom:1px solid rgba(237,230,214,.08)}
.ev-live-channel:nth-child(2n){border-right:0}
.ev-live-channel strong{font-size:18px}
.ev-live-channel span{font-size:10px}
.ev-live-story{padding:1.1rem 0;border-bottom:1px solid rgba(237,230,214,.08)}
.ev-live-story>a{display:block;text-decoration:none;padding:0}
.ev-live-story>button{margin-top:.7rem;border:0;background:none;padding:0;color:var(--earth);font-size:8px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
.ev-live-empty{padding:1.2rem 0}
.ev-live-empty strong{display:block;font-family:'Fraunces',serif;font-size:22px;font-weight:300}
.ev-live-empty span{display:block;margin-top:.4rem;font-size:10px;line-height:1.6;color:rgba(237,230,214,.5)}

/* Phase 3 · Enkiama Live surfaces */
.ev-live-open,.ev-field-open{border:0;background:none;color:rgba(237,230,214,.72);font:inherit;font-size:9px;letter-spacing:.17em;text-transform:uppercase;cursor:pointer;padding:.45rem 0}
.ev-live-open{border-bottom:1px solid rgba(190,158,104,.35)}
.ev-field-open{display:none;margin-top:1rem;color:var(--earth)}
.ev-field-open.visible{display:inline-block}
.ev-live-panel,.ev-field{position:absolute;z-index:40;top:0;right:0;height:100%;width:min(480px,92vw);background:rgba(9,15,11,.975);backdrop-filter:blur(16px);border-left:1px solid rgba(237,230,214,.11);transform:translateX(102%);transition:transform .55s cubic-bezier(.16,1,.3,1);overflow:auto}
.ev-live-panel.open,.ev-field.open{transform:translateX(0)}
.ev-live-panel__head,.ev-field__head{position:sticky;top:0;z-index:2;background:rgba(9,15,11,.96);display:flex;align-items:center;justify-content:space-between;padding:1.4rem 1.5rem;border-bottom:1px solid rgba(237,230,214,.1);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--earth)}
.ev-live-panel__head button,.ev-field__head button{border:0;background:none;color:var(--bone);font-size:20px;cursor:pointer}
.ev-live-panel__channels{padding:1rem 1.5rem;border-bottom:1px solid rgba(237,230,214,.1)}
.ev-live-channel{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(237,230,214,.08);padding:1rem 0;color:var(--bone);cursor:default}
.ev-live-channel:last-child{border-bottom:0}
.ev-live-channel strong{display:block;font-family:'Fraunces',serif;font-size:22px;font-weight:300}
.ev-live-channel span{display:block;margin-top:.35rem;font-size:11px;line-height:1.6;color:rgba(237,230,214,.55)}
.ev-live-panel__stories{padding:1.2rem 1.5rem}
.ev-live-panel__stories a{display:block;text-decoration:none;padding:1.1rem 0;border-bottom:1px solid rgba(237,230,214,.08)}
.ev-live-panel__stories span{display:block;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--earth)}
.ev-live-panel__stories strong{display:block;font-family:'Fraunces',serif;font-size:24px;font-weight:300;margin:.4rem 0}
.ev-live-panel__stories small{display:block;font-size:10px;line-height:1.6;color:rgba(237,230,214,.5)}
.ev-field__items{padding:1rem 1.5rem 2rem}
.ev-field__items article{padding:1.25rem 0;border-bottom:1px solid rgba(237,230,214,.08)}
.ev-field__items article span{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--earth)}
.ev-field__items article strong{display:block;font-family:'Fraunces',serif;font-size:26px;font-weight:300;margin:.45rem 0}
.ev-field__items article p{font-size:12px;line-height:1.7;color:rgba(237,230,214,.62);margin:0}
@media(max-width:760px){.ev-live-panel,.ev-field{width:100vw}.ev-live-open{font-size:8px}}

/* Phase 5 · final Live cascade */
.ev-live-panel__channels{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;border-bottom:1px solid rgba(237,230,214,.1)}

      <figure><img src="assets/images/kibosho-family.jpg" alt=""><figcaption>Kibosho · Kilimanjaro highlands</figcaption></figure>
      <figure><img src="assets/images/camp-arrival.jpg" alt=""><figcaption>Arrival · on the road</figcaption></figure>

    </div>

  <section class="ev-scene route s3"
    data-scene-role="route"
    data-chapter="Act IV · Operated"
    data-kicker="Operated · July 2026 · 5 travellers"
    data-title="One journey. Four different <em>rhythms.</em>"
    data-note="Mountain culture, safari, Rift landscape and coast were composed as one route rather than four separate products."
    data-route="Kilimanjaro → Tarangire → Ngorongoro → Serengeti → Zanzibar"
    data-evidence="13|nights;5|travellers;4|journey worlds"
    data-link="journeys.html"
    data-link-label="See operated journeys"
    data-meta="Operated evidence">
    <div class="ev-media" aria-hidden="true"></div>
    <div class="ev-atlas" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path d="M30,83 C170,24 270,28 365,60 S565,100 690,69 S835,40 968,27"></path>
        <circle cx="30" cy="83" r="4"></circle>
        <circle cx="255" cy="38" r="4"></circle>
        <circle cx="445" cy="82" r="4"></circle>
        <circle cx="690" cy="69" r="4"></circle>
        <circle cx="968" cy="27" r="4"></circle>
        <text x="28" y="108">Kilimanjaro</text>
        <text x="218" y="20">Tarangire</text>
        <text x="405" y="108">Ngorongoro</text>
        <text x="660" y="48">Serengeti</text>
        <text x="918" y="16">Zanzibar</text>
      </svg>

  </section>

  <section class="ev-scene split s4"
    data-scene-role="intelligence"
    data-chapter="Act V · The country changes"
    data-kicker="Season · distance · pace"
    data-title="The same Tanzania does not exist <em>every month.</em>"
    data-note="Rain, wildlife movement, altitude, road time and ocean conditions change what belongs together. Good planning is often deciding what not to force into the route."
    data-link="parks.html"
    data-link-label="Compare landscapes"
    data-meta="Route intelligence">
    <div class="ev-media" aria-hidden="true"></div>
  </section>

  <section class="ev-scene frame"
    data-scene-role="coast-transition"
    data-chapter="Act VI · Coast"
    data-kicker="Stone Town · then the Indian Ocean"
    data-title="The journey can change <em>tempo.</em>"
    data-note="City, history and coast should feel like a new chapter, not an automatic beach extension after safari."
    data-route="Stone Town → coast"
    data-link="zanzibar.html"
    data-link-label="Explore Zanzibar"
    data-meta="Coast transition">
    <div class="ev-media" style="background-image:url('assets/images/stonetown.jpg');background-position:center 50%" aria-hidden="true"></div>
    <div class="ev-frame-label">Documentary frame · lower-resolution source used intentionally</div>

    data-scene-role="coast-exhale"
    data-chapter="Act VII · Exhale"

    data-note="Dates, people and what is drawing you to Tanzania are enough to begin. The route comes after."
    data-link="begin.html"
    data-link-label="Begin a conversation"
    data-meta="Enkiama"></section>

  <header class="ev-top">
    <a class="ev-logo" href="index.html" aria-label="Back to Enkiama"><img src="assets/logo-header.png" alt="Enkiama Tanzania"></a>
    <div class="ev-top-right">
      <button class="ev-live-open" id="evLiveOpen" type="button">Enkiama Live</button>
      <span class="ev-mode" id="evMode">Journey view</span>
      <a class="ev-exit" id="evExit" href="index.html">Exit</a>
    </div>
  </header>

  <div class="ev-chapter" id="evChapter">Act I · Tanzania</div>
  <div class="ev-number" id="evNumber" aria-hidden="true">01</div>

  <section class="ev-copy" aria-live="polite">
    <p class="ev-kicker" id="evKicker">Enkiama · Tanzania</p>
    <h1 class="ev-title" id="evTitle">You are not choosing <em>a safari.</em></h1>
    <p class="ev-note" id="evNote">You are deciding how to cross Tanzania.</p>
    <p class="ev-route" id="evRoute"></p>
    <div class="ev-evidence" id="evEvidence"></div>
    <a class="ev-link" id="evLink"></a>
    <button class="ev-field-open" id="evFieldOpen" type="button">Open field guide →</button>
  </section>

  <div class="ev-controls" aria-label="View controls">
    <button class="ev-btn" id="evPrev" aria-label="Previous scene">←</button>
    <button class="ev-btn" id="evPause" aria-label="Play view">▶</button>
    <button class="ev-btn" id="evNext" aria-label="Next scene">→</button>
  </div>

  <div class="ev-rail">
    <div class="ev-progress"><span id="evProgress" class="run"></span></div>
    <div class="ev-meta"><span class="ev-index" id="evIndex">01 / 08</span><span id="evMeta">Opening</span></div>
  </div>
  <div class="ev-panel-scrim" id="evPanelScrim" aria-hidden="true"></div>
  <aside class="ev-live-panel" id="evLivePanel" aria-label="Enkiama Live index" aria-hidden="true"></aside>
  <aside class="ev-field" id="evFieldGuide" aria-label="Field guide" aria-hidden="true"></aside>
</main>

<script src="assets/js/enkiama-live.js"></script>
<script src="assets/js/journey-draft.js"></script>
<script>
(function(){
  var scenes=[];
  function refreshScenes(){scenes=[].slice.call(document.querySelectorAll('.ev-scene')).filter(function(scene){return !scene.hidden;});}
  var kicker=document.getElementById('evKicker');
  var title=document.getElementById('evTitle');
  var note=document.getElementById('evNote');
  var route=document.getElementById('evRoute');
  var evidence=document.getElementById('evEvidence');
  var chapter=document.getElementById('evChapter');
  var number=document.getElementById('evNumber');
  var link=document.getElementById('evLink');
  var index=document.getElementById('evIndex');
  var meta=document.getElementById('evMeta');
  var progress=document.getElementById('evProgress');
  var pause=document.getElementById('evPause');
  var fieldOpen=document.getElementById('evFieldOpen');
  var evMode=document.getElementById('evMode');
  var evExit=document.getElementById('evExit');
  var returnHref='index.html';
  var interval=10000;
  var composeState=null;
  var fromCompose=new URLSearchParams(location.search).get('from')==='compose';
  if(fromCompose){
    if(window.EnkiamaJourneyDraft)composeState=window.EnkiamaJourneyDraft.read();
    else try{composeState=JSON.parse(sessionStorage.getItem('enkiama.composition')||'null');}catch(e){composeState=null;}
  }
  if(composeState&&Array.isArray(composeState.route)&&composeState.route.length){
    document.querySelector('.ev')?.classList.add('composed-mode');
    var firstScene=document.querySelector('.ev-scene');
    var closeScene=document.querySelector('.ev-scene:last-of-type');
    var pull=(composeState.preferences&&composeState.preferences.pull)||'all';
    var composedTitles={
      stillness:'A first route with more <em>space.</em>',
      spectacle:'A first route led by <em>wildlife.</em>',
      people:'A first route that begins with <em>people.</em>',
      all:'A broader first <em>arc.</em>'
    };
    firstScene.dataset.chapter='Your composition · First shape';
    firstScene.dataset.kicker='Composed from your choices';
    firstScene.dataset.title=composedTitles[pull]||composedTitles.all;
    firstScene.dataset.note='This is the direction you just shaped — not a fixed itinerary. Move through the view, then return to refine the route or continue the conversation.';
    firstScene.dataset.route=composeState.route.join(' → ');
    if(composeState.labels){
      firstScene.dataset.evidence=[
        (composeState.labels.time||'Open')+'|time',
        (composeState.labels.pace||'Open')+'|pace',
        (composeState.labels.who||'Open')+'|travelling'
      ].join(';');
    }
    firstScene.dataset.meta='Your first composition';

    var preferences=composeState.preferences||{};
    var coastChoice=preferences.coast||'maybe';
    var routeScene=document.querySelector('.ev-scene[data-scene-role="route"]');
    var routeDirector=document.getElementById('evRouteDirector');
    if(routeScene){
      routeScene.dataset.chapter='Your route · First movement';
      routeScene.dataset.kicker='Composed from your route';
      routeScene.dataset.title='A sequence shaped around <em>your choices.</em>';
      routeScene.dataset.note='The order is provisional, but the geography now reflects the direction you composed rather than a generic Tanzania circuit.';
      routeScene.dataset.route=composeState.route.join(' → ');
      routeScene.dataset.meta='Your route';
      routeScene.dataset.orchestrated='true';
    }
    if(routeDirector){
      routeDirector.innerHTML=composeState.route.map(function(stop,idx){
        var clean=String(stop).replace(/\s*\(option\)\s*/i,'');
        return '<div class="ev-route-stop" style="--route-i:'+idx+'"><span>'+clean+'</span></div>';
      }).join('');
    }

    var roleMap={};
    document.querySelectorAll('.ev-scene[data-scene-role]').forEach(function(scene){roleMap[scene.dataset.sceneRole]=scene;});
    var orders={
      people:['opening','human','place','route','intelligence'],
      spectacle:['opening','route','intelligence','place','human'],
      stillness:['opening','place','intelligence','route','human'],
      all:['opening','place','human','route','intelligence']
    };
    var order=(orders[pull]||orders.all).slice();

    /* Short journeys stay concentrated. Keep the traveller's stated priority,
       but remove one secondary editorial chapter rather than rushing every scene. */
    if(preferences.time==='short'){
      if(pull==='people') order=order.filter(function(role){return role!=='intelligence';});
      else order=order.filter(function(role){return role!=='human';});
    }

    if(coastChoice==='yes'){
      order.push('coast-transition','coast-exhale');
    }else if(coastChoice==='maybe'){
      order.push('coast-transition');
    }
    order.push('close');

    Object.keys(roleMap).forEach(function(role){
      roleMap[role].hidden=order.indexOf(role)===-1;
    });
    var sceneHost=document.querySelector('.ev');
    order.forEach(function(role){
      if(roleMap[role]) sceneHost.insertBefore(roleMap[role], document.querySelector('.ev-top'));
    });

    if(preferences.pace==='slow') interval=12500;
    else if(preferences.pace==='full') interval=8200;
    else interval=10000;

    if(closeScene&&composeState.message){
      closeScene.dataset.link='begin.html?draft=1';
      closeScene.dataset.linkLabel='Continue this conversation';
    }
    returnHref='compose.html#cmpResult';
    if(evMode)evMode.textContent='Your journey view';
    if(evExit){evExit.href=returnHref;evExit.textContent='Back to composition';}
  }
  var current=0,timer=null,paused=true,drawerPaused=false;
  var viewer=document.querySelector('.ev');
  var chromeTimer=null,wheelResetTimer=null,wheelAccumulator=0,lastWheelNav=0,touchStart=null;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function revealChrome(){
    if(!viewer)return;
    viewer.classList.remove('chrome-idle');
    clearTimeout(chromeTimer);
    if(!drawerPaused) chromeTimer=setTimeout(function(){viewer.classList.add('chrome-idle');},2800);
  }

  function navigateByIntent(direction){
    show(current+(direction>0?1:-1));
    schedule();
    revealChrome();
  }

  function restartProgress(){
    progress.classList.remove('run');
    progress.style.setProperty('--ev-scene-duration',(sceneDelay()/1000)+'s');
    void progress.offsetWidth;
    if(!paused&&!drawerPaused&&!reduce) progress.classList.add('run');
  }

  function setEvidence(raw){
    evidence.innerHTML='';
    evidence.classList.remove('visible');
    if(!raw) return;
    raw.split(';').forEach(function(item){
      var p=item.split('|');
      if(p.length<2) return;
      var el=document.createElement('span');
      el.className='ev-chip';
      el.innerHTML='<b>'+p[0]+'</b>'+p[1];
      evidence.appendChild(el);
    });
    if(evidence.children.length) evidence.classList.add('visible');
  }

  function show(i){
    refreshScenes();
    if(!scenes.length) return;
    current=(i+scenes.length)%scenes.length;
    var copy=document.querySelector('.ev-copy');
    if(copy)copy.classList.add('is-changing','is-entering');
    var routeDirector=document.getElementById('evRouteDirector');
    if(routeDirector)routeDirector.classList.remove('route-drawing');
    scenes.forEach(function(scene,n){scene.classList.toggle('active',n===current);});
    var s=scenes[current];
    kicker.textContent=s.dataset.kicker||'';
    title.innerHTML=s.dataset.title||'';
    note.textContent=s.dataset.note||'';
    chapter.textContent=s.dataset.chapter||'';
    number.textContent=String(current+1).padStart(2,'0');
    index.textContent=String(current+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
    meta.textContent=s.dataset.meta||'Enkiama';
    if(fieldOpen){
      if(s.dataset.fieldGuide){
        fieldOpen.classList.add('visible');
        fieldOpen.setAttribute('data-field-guide',s.dataset.fieldGuide);
      }else{
        fieldOpen.classList.remove('visible');
        fieldOpen.removeAttribute('data-field-guide');
      }
    }

    if(s.dataset.route){
      route.textContent=s.dataset.route;
      route.classList.add('visible');
    }else{
      route.textContent='';
      route.classList.remove('visible');
    }

    setEvidence(s.dataset.evidence||'');

    if(s.dataset.link){
      link.href=s.dataset.link;
      link.textContent=(s.dataset.linkLabel||'Open')+' →';
      link.classList.add('visible');
    }else{
      link.removeAttribute('href');
      link.textContent='';
      link.classList.remove('visible');
    }
    restartProgress();
    if(copy){
      window.setTimeout(function(){copy.classList.remove('is-changing');},70);
      window.setTimeout(function(){copy.classList.remove('is-entering');},105);
    }
    if(routeDirector&&s.dataset.sceneRole==='route'&&!reduce){
      window.setTimeout(function(){routeDirector.classList.add('route-drawing');},180);
    }else if(routeDirector&&s.dataset.sceneRole==='route'){
      routeDirector.classList.add('route-drawing');
    }
  }

  function sceneDelay(){
    var active=scenes[current];
    var role=active&&active.dataset.sceneRole;
    if(role==='coast-exhale') return Math.round(interval*1.28);
    if(role==='opening'||role==='close') return Math.round(interval*1.12);
    return interval;
  }
  function schedule(){
    clearTimeout(timer);
    if(!paused&&!drawerPaused&&!reduce) timer=setTimeout(function(){show(current+1);schedule();},sceneDelay());
  }

  document.getElementById('evPrev').addEventListener('click',function(){navigateByIntent(-1);});
  document.getElementById('evNext').addEventListener('click',function(){navigateByIntent(1);});
  pause.addEventListener('click',function(){
    paused=!paused;
    pause.textContent=paused?'▶':'Ⅱ';
    pause.setAttribute('aria-label',paused?'Play view':'Pause view');
    if(paused){clearTimeout(timer);progress.classList.remove('run');}
    else{restartProgress();schedule();}
  });

  document.addEventListener('keydown',function(e){
    revealChrome();
    if(drawerPaused)return;
    var interactive=e.target&&e.target.closest&&e.target.closest('a,button,input,textarea,select');
    if(e.key==='ArrowRight')navigateByIntent(1);
    if(e.key==='ArrowLeft')navigateByIntent(-1);
    if(e.key===' '&&!interactive){e.preventDefault();pause.click();}
    if(e.key==='Escape') location.href=returnHref;
  });

  if(viewer){
    viewer.addEventListener('pointermove',revealChrome,{passive:true});
    viewer.addEventListener('pointerdown',revealChrome,{passive:true});
    viewer.addEventListener('touchstart',function(e){
      revealChrome();
      if(drawerPaused||!e.touches||!e.touches[0]||e.target.closest('.ev-live-panel,.ev-field,.ev-route-director'))return;
      touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()};
    },{passive:true});
    viewer.addEventListener('touchend',function(e){
      if(!touchStart||drawerPaused||!e.changedTouches||!e.changedTouches[0]){touchStart=null;return;}
      var dx=e.changedTouches[0].clientX-touchStart.x;
      var dy=e.changedTouches[0].clientY-touchStart.y;
      var elapsed=Date.now()-touchStart.t;
      touchStart=null;
      if(elapsed>850||Math.abs(dx)<56||Math.abs(dx)<Math.abs(dy)*1.08)return;
      navigateByIntent(dx<0?1:-1);
    },{passive:true});
    viewer.addEventListener('wheel',function(e){
      revealChrome();
      if(drawerPaused||e.ctrlKey||e.target.closest('.ev-live-panel,.ev-field,.ev-route-director'))return;
      var delta=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;
      if(!delta)return;
      wheelAccumulator+=delta;
      clearTimeout(wheelResetTimer);
      wheelResetTimer=setTimeout(function(){wheelAccumulator=0;},170);
      var now=Date.now();
      if(now-lastWheelNav<780||Math.abs(wheelAccumulator)<90)return;
      if(e.cancelable)e.preventDefault();
      lastWheelNav=now;
      var direction=wheelAccumulator>0?1:-1;
      wheelAccumulator=0;
      navigateByIntent(direction);
    },{passive:false});
  }

  revealChrome();
  refreshScenes();
  show(0);
  schedule();

  document.addEventListener('enkiama-live-drawer',function(e){
    drawerPaused=!!(e.detail&&e.detail.open);
    revealChrome();
    if(drawerPaused){
      clearTimeout(timer);
      progress.classList.remove('run');
    }else{
      restartProgress();
      schedule();
    }
  });

  document.addEventListener('enkiama-live-ready',function(){
    refreshScenes();
    current=0;
    show(0);
    schedule();
  });
})();
</script>
