<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience View — Enkiama</title>
<meta name="description" content="A full-screen cinematic view into Tanzania by Enkiama.">
<meta name="theme-color" content="#0B110D">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B110D;
  --bone:#EDE6D6;
  --earth:#BE9E68;
  --muted:rgba(237,230,214,.62);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Instrument Sans',sans-serif;color:var(--bone)}
a{color:inherit}
.ev{position:relative;width:100vw;height:100dvh;background:#08100b;isolation:isolate}
.ev-scene{position:absolute;inset:0;opacity:0;transform:scale(1.035);transition:opacity 1.8s ease,transform 8s ease;background-size:cover;background-position:center}
.ev-scene.active{opacity:1;transform:scale(1)}
.ev-scene::after{content:'';position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(6,11,8,.24),rgba(6,11,8,.04) 36%,rgba(6,11,8,.66) 100%),
  linear-gradient(90deg,rgba(6,11,8,.46),transparent 45%)}
.s1{background-image:url('assets/hero-dawn.jpg');background-position:center 48%}
.s2{background-image:url('assets/serengeti.jpg');background-position:center}
.s3{background-image:url('assets/maasai.jpg');background-position:center 42%}
.s4{background-image:url('assets/ruaha.jpg');background-position:center}
.s5{background-image:url('assets/zanzibar.jpg');background-position:center 58%}

.ev-top{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:clamp(1.3rem,3vw,2.5rem) clamp(1.3rem,4vw,3.5rem)}
.ev-logo img{height:clamp(34px,4vw,48px);width:auto;display:block}
.ev-exit{display:flex;align-items:center;gap:.7rem;text-decoration:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(237,230,214,.78)}
.ev-exit::after{content:'×';font-size:20px;line-height:1;color:var(--earth)}

.ev-copy{position:absolute;z-index:5;left:clamp(1.4rem,7vw,7rem);bottom:clamp(5.5rem,12vh,8.5rem);max-width:min(760px,76vw)}
.ev-kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--earth);margin:0 0 1rem}
.ev-title{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(48px,8.2vw,118px);line-height:.92;letter-spacing:-.035em;margin:0;color:var(--bone);text-wrap:balance}
.ev-title em{font-style:italic;color:var(--earth)}
.ev-note{max-width:48ch;margin:1.5rem 0 0;color:var(--muted);font-size:clamp(13px,1.2vw,16px);line-height:1.65}

.ev-rail{position:absolute;z-index:6;left:clamp(1.4rem,7vw,7rem);right:clamp(1.4rem,7vw,7rem);bottom:clamp(1.6rem,3vw,2.6rem);display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end}
.ev-progress{height:1px;background:rgba(237,230,214,.18);position:relative;overflow:hidden}
.ev-progress span{position:absolute;inset:0 auto 0 0;width:0;background:var(--earth)}
.ev-progress span.run{animation:ev-progress 8s linear forwards}
@keyframes ev-progress{from{width:0}to{width:100%}}
.ev-meta{display:flex;gap:1rem;align-items:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,230,214,.52)}
.ev-index{color:var(--earth)}
.ev-controls{position:absolute;z-index:7;right:clamp(1.4rem,4vw,3.5rem);bottom:clamp(4.8rem,9vh,7rem);display:flex;gap:.5rem}
.ev-btn{width:42px;height:42px;border:1px solid rgba(237,230,214,.22);border-radius:50%;background:rgba(7,12,9,.24);color:var(--bone);display:grid;place-items:center;cursor:pointer;font-size:17px;backdrop-filter:blur(6px)}
.ev-btn:hover{border-color:rgba(190,158,104,.7);color:var(--earth)}
.ev-tvmark{position:absolute;z-index:5;right:clamp(1.4rem,4vw,3.5rem);top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,230,214,.34)}

@media(max-width:700px){
  .ev-copy{max-width:88vw;bottom:7rem}
  .ev-title{font-size:clamp(42px,14vw,72px)}
  .ev-note{max-width:34ch}
  .ev-controls{bottom:4.7rem}
  .ev-rail{grid-template-columns:1fr}
  .ev-meta{display:none}
  .ev-tvmark{display:none}
}
@media(prefers-reduced-motion:reduce){
  .ev-scene{transition:opacity .35s ease;transform:none}
  .ev-progress span.run{animation:none;width:100%}
}
</style>
</head>
<body>
<main class="ev" aria-label="Enkiama Experience View">
  <div class="ev-scene s1 active" data-kicker="Enkiama · Experience View" data-title="A window into <em>Tanzania.</em>" data-note="No itinerary. No catalogue. Just a sequence of places, people and landscapes that make the journey possible."></div>
  <div class="ev-scene s2" data-kicker="Now showing · Serengeti" data-title="The plain keeps <em>moving.</em>" data-note="Distance, migration and the patience to let the landscape set the pace."></div>
  <div class="ev-scene s3" data-kicker="People · Place · Continuity" data-title="Travel through <em>relationships.</em>" data-note="Enkiama is built around people who know the land, the seasons and the communities that give each place meaning."></div>
  <div class="ev-scene s4" data-kicker="Wild Tanzania · South" data-title="Space enough to <em>disappear into.</em>" data-note="A quieter Tanzania: long horizons, fewer vehicles and a different rhythm of safari."></div>
  <div class="ev-scene s5" data-kicker="Coast · Zanzibar" data-title="Then the journey <em>exhales.</em>" data-note="Stone, sea, heat and time — a coast that changes the final tempo of the journey."></div>

  <header class="ev-top">
    <a class="ev-logo" href="index.html" aria-label="Back to Enkiama"><img src="assets/logo-header.png" alt="Enkiama Tanzania"></a>
    <a class="ev-exit" href="index.html">Exit view</a>
  </header>

  <section class="ev-copy" aria-live="polite">
    <p class="ev-kicker" id="evKicker">Enkiama · Experience View</p>
    <h1 class="ev-title" id="evTitle">A window into <em>Tanzania.</em></h1>
    <p class="ev-note" id="evNote">No itinerary. No catalogue. Just a sequence of places, people and landscapes that make the journey possible.</p>
  </section>

  <div class="ev-controls" aria-label="Experience controls">
    <button class="ev-btn" id="evPrev" aria-label="Previous scene">←</button>
    <button class="ev-btn" id="evPause" aria-label="Pause Experience View">Ⅱ</button>
    <button class="ev-btn" id="evNext" aria-label="Next scene">→</button>
  </div>

  <div class="ev-tvmark">Designed to live full screen</div>

  <div class="ev-rail">
    <div class="ev-progress"><span id="evProgress" class="run"></span></div>
    <div class="ev-meta"><span class="ev-index" id="evIndex">01 / 05</span><span>Enkiama · Tanzania</span></div>
  </div>
</main>

<script>
(function(){
  var scenes=[].slice.call(document.querySelectorAll('.ev-scene'));
  var kicker=document.getElementById('evKicker');
  var title=document.getElementById('evTitle');
  var note=document.getElementById('evNote');
  var index=document.getElementById('evIndex');
  var progress=document.getElementById('evProgress');
  var pause=document.getElementById('evPause');
  var current=0, timer=null, paused=false, interval=8000;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function restartProgress(){
    progress.classList.remove('run');
    void progress.offsetWidth;
    if(!paused&&!reduce) progress.classList.add('run');
  }
  function show(i){
    current=(i+scenes.length)%scenes.length;
    scenes.forEach(function(s,n){s.classList.toggle('active',n===current);});
    var s=scenes[current];
    kicker.textContent=s.dataset.kicker;
    title.innerHTML=s.dataset.title;
    note.textContent=s.dataset.note;
    index.textContent=String(current+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
    restartProgress();
  }
  function schedule(){
    clearInterval(timer);
    if(!paused&&!reduce) timer=setInterval(function(){show(current+1);},interval);
  }
  document.getElementById('evPrev').addEventListener('click',function(){show(current-1);schedule();});
  document.getElementById('evNext').addEventListener('click',function(){show(current+1);schedule();});
  pause.addEventListener('click',function(){
    paused=!paused;
    pause.textContent=paused?'▶':'Ⅱ';
    pause.setAttribute('aria-label',paused?'Play Experience View':'Pause Experience View');
    if(paused){clearInterval(timer);progress.classList.remove('run');}
    else{restartProgress();schedule();}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'){show(current+1);schedule();}
    if(e.key==='ArrowLeft'){show(current-1);schedule();}
    if(e.key===' '){e.preventDefault();pause.click();}
    if(e.key==='Escape')location.href='index.html';
  });
  schedule();
})();
</script>
</body>
</html>
