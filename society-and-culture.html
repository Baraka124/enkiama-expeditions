<section class="culture-hero">
  <div class="culture-hero__media" aria-hidden="true"></div>
  <div class="culture-hero__veil"></div>
  <div class="culture-hero__copy">
    <p class="culture-hero__eyebrow">Society &amp; culture · Tanzania</p>
    <h1>People are part of the <em>route.</em></h1>
    <p class="culture-hero__lede">Tanzania is travelled through inhabited landscapes: farms on Kilimanjaro, pastoral country across the north, trading towns on the coast, cities, villages, languages and family networks. Wildlife is one part of the country, not a separate world from the people living around it.</p>
  </div>
  <aside class="culture-hero__aside">
    <div class="culture-hero__aside-inner">
      <span class="culture-kicker">A useful distinction</span>
      <div><strong>Culture is not a stop added between parks.</strong><p>It appears through the places you stay, the people guiding you, the food you eat and the communities whose land the route passes through.</p></div>
    </div>
  </aside>
</section>

<section class="culture-index">
  <div class="culture-index__intro">
    <p class="culture-kicker">Four cultural landscapes</p>
    <h2>Different places. Different histories.</h2>
    <p>This page does not try to summarise Tanzania into one idea of “local culture”. It follows four contexts that frequently intersect with Enkiama journeys.</p>
  </div>
  <div class="culture-index__grid">
    <a class="culture-index__item" href="#language"><span>01 · Language</span><strong>Kiswahili &amp; national life</strong><small>A shared language across a highly diverse country.</small></a>
    <a class="culture-index__item" href="#kilimanjaro-culture"><span>02 · Highlands</span><strong>Kilimanjaro &amp; Chagga country</strong><small>Coffee, cultivation, settlements and mountain life.</small></a>
    <a class="culture-index__item" href="#pastoral-country"><span>03 · Northern rangelands</span><strong>Pastoral country</strong><small>Land, livestock and communities across the northern landscape.</small></a>
    <a class="culture-index__item" href="#coast"><span>04 · Indian Ocean</span><strong>The Swahili coast</strong><small>Trade, architecture, religion, food and island life.</small></a>
  </div>
</section>

<section class="culture-chapter" id="language">
  <div class="culture-chapter__media">
    <div class="culture-chapter__img" style="background-image:url('assets/arusha.jpg');background-position:50% 48%"></div>
    <div class="culture-chapter__shade"></div>
    <div class="culture-chapter__caption"><span>Everyday Tanzania</span><span>Language connects regions</span></div>
  </div>
  <div class="culture-chapter__body">
    <p class="culture-kicker">01 · Language</p>
    <h2>Kiswahili is part of how the country <em>holds together.</em></h2>
    <p>Tanzania contains many ethnic and linguistic communities. Kiswahili provides a shared public language across regions, while local languages remain part of family and community life. For travellers, even a small amount of Kiswahili changes ordinary interactions: greetings become conversations, and the country feels less like scenery being passed through.</p>
    <div class="culture-note"><span class="culture-note__label">Field note</span><p>Language is useful context, but it is also practical: guides move between Kiswahili, English and local languages throughout a journey.</p></div>
    <div class="culture-path"><span class="culture-path__index">Continue</span><a href="tanzania.html">Explore Tanzania →</a></div>
  </div>
</section>

<section class="culture-chapter reverse" id="kilimanjaro-culture">
  <div class="culture-chapter__media">
    <div class="culture-chapter__img" style="background-image:url('assets/images/kilimanjaro.jpg');background-position:50% 42%"></div>
    <div class="culture-chapter__shade"></div>
    <div class="culture-chapter__caption"><span>Kilimanjaro highlands</span><span>Mountain · farms · settlements</span></div>
  </div>
  <div class="culture-chapter__body">
    <p class="culture-kicker">02 · Kilimanjaro highlands</p>
    <h2>The mountain is also a <em>lived landscape.</em></h2>
    <p>Around Moshi and the southern slopes of Kilimanjaro, Chagga communities have long cultivated densely settled highland farms. Coffee, bananas, irrigation, family compounds and the mountain itself sit within the same landscape. A day in Kibosho can therefore change how the next view of Kilimanjaro is understood: not only as a summit, but as home.</p>
    <div class="culture-note"><span class="culture-note__label">How this enters a journey</span><p>Waterfall walks, coffee preparation, meals and time with local guides can sit naturally before or after a safari circuit without becoming a staged “cultural day”.</p></div>
    <div class="culture-path"><span class="culture-path__index">Continue</span><a href="kilimanjaro.html">Explore Kilimanjaro country →</a><a href="trip.html?slug=july-five-travellers-2026">See this in an operated journey →</a></div>
  </div>
</section>

<section class="culture-human">
  <div class="culture-human__copy">
    <p class="culture-kicker">How Enkiama handles cultural encounters</p>
    <h2>The method matters more than the label.</h2>
    <p>We do not need every cultural element to become a formal “visit”. Some of the strongest encounters happen because the route allows enough time for people, guides and hosts to remain part of the day rather than being compressed into a scheduled performance.</p>
  </div>
  <div class="culture-human__principles">
    <div class="culture-principle"><span>01</span><strong>Agreement</strong><p>Hosts and communities should know what is being arranged and be comfortable with the exchange.</p></div>
    <div class="culture-principle"><span>02</span><strong>Time</strong><p>Short photo stops create a very different relationship from spending enough time to understand where you are.</p></div>
    <div class="culture-principle"><span>03</span><strong>Local knowledge</strong><p>Community and local guides interpret places from within them, rather than speaking about people from outside.</p></div>
    <div class="culture-principle"><span>04</span><strong>Compensation</strong><p>Where a hosted activity is paid, the arrangement and who benefits should be clear.</p></div>
  </div>
</section>

<section class="culture-chapter" id="pastoral-country">
  <div class="culture-chapter__media">
    <div class="culture-chapter__img" style="background-image:url('assets/great-rift.jpg');background-position:50% 50%"></div>
    <div class="culture-chapter__shade"></div>
    <div class="culture-chapter__caption"><span>Northern Tanzania</span><span>Rangelands · Rift Valley</span></div>
  </div>
  <div class="culture-chapter__body">
    <p class="culture-kicker">03 · Northern rangelands</p>
    <h2>Pastoral life is tied to <em>land.</em></h2>
    <p>Across parts of northern Tanzania, Maasai communities and other pastoral groups live within landscapes that travellers often experience primarily as safari country. Livestock, seasonal movement, access to grazing and conservation boundaries all shape daily life. A community encounter makes more sense when it is understood inside that wider relationship with land rather than reduced to clothing, dance or photographs.</p>
    <div class="culture-note"><span class="culture-note__label">Route context</span><p>Lake Natron and the northern Rift Valley make this relationship especially visible because the journey moves beyond the most conventional park-to-park corridor.</p></div>
    <div class="culture-path"><span class="culture-path__index">Continue</span><a href="great-rift.html">Explore the Great Rift →</a><a href="trip.html?slug=july-five-travellers-2026">See the July route →</a></div>
  </div>
</section>

<section class="culture-chapter reverse" id="coast">
  <div class="culture-chapter__media">
    <div class="culture-chapter__img" style="background-image:url('assets/images/zanzibar.jpg');background-position:50% 58%"></div>
    <div class="culture-chapter__shade"></div>
    <div class="culture-chapter__caption"><span>Indian Ocean</span><span>Zanzibar · Swahili coast</span></div>
  </div>
  <div class="culture-chapter__body">
    <p class="culture-kicker">04 · The coast</p>
    <h2>A different cultural geography <em>entirely.</em></h2>
    <p>On Zanzibar and along the Swahili coast, the cultural landscape has been shaped by centuries of Indian Ocean exchange. Stone Town makes this visible in architecture, food, religious life, language and the structure of the city itself. Ending a mainland journey here is not simply “adding the beach”; it moves the traveller into another historical world.</p>
    <div class="culture-note"><span class="culture-note__label">Field note</span><p>Stone Town is a UNESCO World Heritage Site whose urban fabric reflects long interaction between African, Arab, Indian and European influences.</p></div>
    <div class="culture-path"><span class="culture-path__index">Continue</span><a href="stonetown.html">Explore Stone Town →</a><a href="zanzibar.html">Explore Zanzibar →</a></div>

<section class="culture-faq">
  <div class="culture-faq__inner">
    <h2>Useful questions.</h2>
    <div class="culture-faq__items">
      <div class="culture-faq__item"><strong>Can cultural time be included without losing safari days?</strong><p>Yes. The stronger approach is often to place it where the route already passes through an inhabited landscape instead of adding a disconnected excursion.</p></div>
      <div class="culture-faq__item"><strong>Do I need to visit a community?</strong><p>No. Culture is present in guides, food, towns, markets, language, farms, history and everyday interactions. A formal community visit is only one possibility.</p></div>
      <div class="culture-faq__item"><strong>How do you decide what is appropriate?</strong><p>We look at who is hosting, how the encounter is arranged, whether it makes sense geographically and whether there is enough time for it to be more than a photo stop.</p></div>
    </div>

<script>
/* ══ MENU IMAGERY — the index reveals the country ══ */
(function(){
  var overlay=document.getElementById('ehOverlay');
  if(!overlay) return;
  var stack=overlay.querySelector('.eh-aside-stack');
  if(!stack) return;
  var caption=document.getElementById('ehAsideCaption');
  var imgs=[].slice.call(stack.querySelectorAll('.eh-aside-img'));
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var loaded=false, holdTimer=null;

  var LABELS={
    tanzania:'The Serengeti', parks:'Ngorongoro', journeys:'Tarangire',
    compose:'First light', family:'Kibosho', begin:'Camp, on arrival',
    kilimanjaro:'Kilimanjaro', companions:'Around the fire', greatrift:'The Rift Valley',
    reflections:'Night over the plain', practical:'Arusha',
    stories:'Stone Town', notes:'Lake Manyara', how:'The people of the land',
    why:'Those who guide'
  };

  /* only fetch the imagery once the menu is actually opened */
  function preload(){
    if(loaded) return; loaded=true;
    imgs.forEach(function(el){
      var src=el.getAttribute('data-src');
      if(!src) return;
      var pre=new Image();
      pre.onload=function(){ el.style.backgroundImage='url("'+src+'")'; };
      pre.src=src;
    });
  }

  function show(key){
    var found=false;
    imgs.forEach(function(el){
      var on = el.getAttribute('data-img')===key;
      el.classList.toggle('on', on);
      if(on) found=true;
    });
    if(!found){
      var d=stack.querySelector('[data-img="default"]');
      if(d) d.classList.add('on');
    }
    if(caption){
      var label=LABELS[key]||'';
      if(label){ caption.textContent=label; caption.classList.add('on'); }
      else { caption.classList.remove('on'); }
    }
  }

  function reset(){
    show('default');
  }

  /* bind every index + secondary link that names a destination */
  var links=[].slice.call(overlay.querySelectorAll('a[data-nav]'));
  links.forEach(function(a){
    var key=a.getAttribute('data-nav');
    function enter(){
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
      links.forEach(function(x){x.classList.remove('previewing');});
      a.classList.add('previewing');
      show(key);
    }
    function leave(){
      a.classList.remove('previewing');
      /* hold the last image briefly so quick passes do not flicker */
      if(holdTimer) clearTimeout(holdTimer);
      holdTimer=setTimeout(reset, 900);
    }
    a.addEventListener('mouseenter',enter);
    a.addEventListener('focus',enter);
    a.addEventListener('mouseleave',leave);
    a.addEventListener('blur',leave);
  });

  /* preload when the menu opens */
  var trigger=document.getElementById('ehTrigger');
  if(trigger) trigger.addEventListener('click', function(){ setTimeout(preload,120); });
  if(!reduce){
    var mo=new MutationObserver(function(){
      if(overlay.classList.contains('open')) preload();
    });
    mo.observe(overlay,{attributes:true,attributeFilter:['class']});
  } else {
    preload();
  }
})();
</script>

<script>
(function(){

  var fine = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  /* ── 1. LENIS SMOOTH SCROLL ── */
  function initLenis(){
    if(reduce || typeof Lenis==='undefined') return null;
    try{
      var lenis=new Lenis({duration:1.1,easing:function(t){return Math.min(1,1.001-Math.pow(2,-10*t));},smoothWheel:true,wheelMultiplier:1,touchMultiplier:1.5});
      function raf(time){lenis.raf(time);requestAnimationFrame(raf);}
      requestAnimationFrame(raf);
      // keep anchor links working
      document.querySelectorAll('a[href^="#"]').forEach(function(a){
        a.addEventListener('click',function(e){var t=document.querySelector(a.getAttribute('href'));if(t){e.preventDefault();lenis.scrollTo(t,{offset:-80});}});
      });
      return lenis;
    }catch(e){return null;}
  }
  // wait for Lenis script to load
  if(document.readyState!=='loading') setTimeout(initLenis,50);
  else window.addEventListener('DOMContentLoaded',function(){setTimeout(initLenis,50);});

  /* ── 2. CUSTOM CURSOR ── */
  if(fine && !reduce){
    var dot=document.createElement('div');dot.className='t1-cursor';
    var ring=document.createElement('div');ring.className='t1-ring';
    document.body.appendChild(dot);document.body.appendChild(ring);
    document.body.classList.add('t1-cursor-on');
    var mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
    (function ringRaf(){rx+=(mx-rx)*0.18;ry+=(my-ry)*0.18;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ringRaf);})();
    // grow over interactive elements
    function bindHover(){
      document.querySelectorAll('a,button,.cmp-opt,.world-row,.eh-trigger,.eh-close').forEach(function(el){
        if(el.dataset.t1bound)return;el.dataset.t1bound=1;
        el.addEventListener('mouseenter',function(){dot.classList.add('t1-hover');ring.classList.add('t1-hover');});
        el.addEventListener('mouseleave',function(){dot.classList.remove('t1-hover');ring.classList.remove('t1-hover');});
      });
    }
    bindHover();
    // hide when leaving window
    document.addEventListener('mouseleave',function(){dot.classList.add('t1-hide');ring.classList.add('t1-hide');});
    document.addEventListener('mouseenter',function(){dot.classList.remove('t1-hide');ring.classList.remove('t1-hide');});
    // re-bind after menu opens (dynamic content)
    var trg=document.getElementById('ehTrigger');if(trg)trg.addEventListener('click',function(){setTimeout(bindHover,100);});
  }

  /* ── 3. SPLIT-TEXT REVEALS on major headings ── */
  if(!reduce){
    // target the big serif headings; wrap words in spans
    var heads=document.querySelectorAll('.hero-hed, .ph-hed, h1.hero-hed');
    heads.forEach(function(h){
      if(h.dataset.t1split)return;h.dataset.t1split=1;
      // only split top-level text nodes, preserve inner tags like <em>/<br>/<span>
      var html=h.innerHTML;
      // split on spaces but keep tags intact - simple approach: wrap text between tags
      var parts=html.split(/(<[^>]+>)/);
      var out=parts.map(function(p){
        if(p.startsWith('<')||p.trim()==='')return p;
        return p.split(/(\s+)/).map(function(w){return w.trim()?'<span class="t1-word">'+w+'</span>':w;}).join('');
      }).join('');
      h.innerHTML=out;
    });
    var words=document.querySelectorAll('.t1-word');
    if(words.length){
      var wo=new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){
            var siblings=[].slice.call(e.target.parentNode.querySelectorAll('.t1-word'));
            var idx=siblings.indexOf(e.target);
            e.target.style.transitionDelay=(idx*0.04)+'s';
            e.target.classList.add('t1-in');
            wo.unobserve(e.target);
          }
        });
      },{threshold:0.2,rootMargin:'0px 0px -10% 0px'});
      words.forEach(function(w){wo.observe(w);});
    }
  }

  /* ── 4. MAGNETIC BUTTONS ── */
  if(fine && !reduce){
    document.querySelectorAll('.btn-primary,.btn-ghost,.n-begin,.eh-trigger').forEach(function(btn){
      btn.classList.add('t1-magnetic');
      btn.addEventListener('mousemove',function(e){
        var r=btn.getBoundingClientRect();
        var x=(e.clientX-r.left-r.width/2)*0.25;
        var y=(e.clientY-r.top-r.height/2)*0.25;
        btn.style.transform='translate('+x+'px,'+y+'px)';
      });
      btn.addEventListener('mouseleave',function(){btn.style.transform='translate(0,0)';});
    });
  }
})();
