name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enkiama-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Structural integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Tailwind build
        run: npm run build:css

      - name: Public-site integrity
        run: python3 scripts/site_integrity.py

      - name: Report generated CSS drift
        shell: bash
        run: |
          if ! git diff --quiet -- assets/css/enkiama.css assets/css/tanzania.css; then
            echo "::warning::Compiled Tailwind output differs from the committed CSS. Run npm run build:css before merging source-CSS changes."
            git diff --stat -- assets/css/enkiama.css assets/css/tanzania.css
          fi

  smoke:
    name: Responsive smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: '22'
          cache: npm

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public-site smoke matrix
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: enkiama-site-integrity
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
