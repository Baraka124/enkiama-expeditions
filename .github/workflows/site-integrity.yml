name: Site integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enkiama-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Structural integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Tailwind build
        run: npm run build:css

      - name: Public-site integrity
        run: python3 scripts/site_integrity.py

      - name: Report generated CSS drift
        shell: bash
        run: |
          if ! git diff --quiet -- assets/css/enkiama.css assets/css/tanzania.css; then
            echo "::warning::Compiled Tailwind output differs from the committed CSS. Run npm run build:css before merging source-CSS changes."
            git diff --stat -- assets/css/enkiama.css assets/css/tanzania.css
          fi

  smoke:
    name: Responsive smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: '22'
          cache: npm

      - name: Install site dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Select PR smoke scope
        id: smoke-scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "pages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > /tmp/enkiama-changed-files.txt
          echo "Changed files:"
          cat /tmp/enkiama-changed-files.txt

          # Any shared system, asset, test, build, workflow or infrastructure change
          # gets the complete regression suite.
          if grep -Evq '^([^/]+\.html|journeys/[^/]+\.html)$' /tmp/enkiama-changed-files.txt; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "pages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pages="$(sed -n -E 's#^(([^/]+\.html)|(journeys/[^/]+\.html))$#\1#p' /tmp/enkiama-changed-files.txt | sort -u | paste -sd, -)"
          if [[ -z "$pages" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "pages=" >> "$GITHUB_OUTPUT"
          else
            echo "mode=focused" >> "$GITHUB_OUTPUT"
            echo "pages=$pages" >> "$GITHUB_OUTPUT"
          fi

      - name: Run focused PR smoke
        if: steps.smoke-scope.outputs.mode == 'focused'
        env:
          ENKIAMA_SMOKE_PAGES: ${{ steps.smoke-scope.outputs.pages }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Focused smoke pages: $ENKIAMA_SMOKE_PAGES"

          tests=(
            tests/site-smoke.spec.cjs
            tests/semantic-accessibility.spec.cjs
          )

          if [[ ",$ENKIAMA_SMOKE_PAGES," == *",kilimanjaro.html,"* || ",$ENKIAMA_SMOKE_PAGES," == *",kilimanjaro-route.html,"* ]]; then
            tests+=(tests/kilimanjaro-seven-route-intelligence.spec.cjs)
          fi

          npx playwright test "${tests[@]}" --config=playwright.config.cjs

      - name: Run full public-site smoke matrix
        if: steps.smoke-scope.outputs.mode == 'full'
        run: npx playwright test --config=playwright.config.cjs

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: enkiama-site-integrity
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
